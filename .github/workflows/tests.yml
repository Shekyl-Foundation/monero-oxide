name: Crypto Tests

# Shekyl vendors only `crypto/` from this fork. The Monero wallet and RPC
# crates stay in the tree as cherry-pick context and are compiled by the
# clippy gate; their tests against a live `monerod` prove nothing Shekyl ships.

on:
  push:
    branches:
      - main
      - 'fcmp\+\+'
    paths:
      - "crypto/**"
      - "monero-oxide/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"

  pull_request:
    paths:
      - "crypto/**"
      - "monero-oxide/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tests.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # 6.0.0

      - name: Build Dependencies
        uses: ./.github/actions/build-dependencies

      # `--all-features` is what enables the feature-gated test targets:
      # `generalized-bulletproofs/tests` (the statement and inner-product gates)
      # and `ec-divisors/ed25519` (the ed-to-Wei vectors). The pure-Rust crypto
      # has no platform-specific code, so one OS is the whole matrix.
      - name: Test the vendored crypto and its one Monero-side consumer
        shell: bash
        run: |
          RUST_BACKTRACE=1 cargo test --locked --all-features \
            -p helioselene \
            -p ec-divisors \
            -p generalized-bulletproofs \
            -p generalized-bulletproofs-circuit-abstraction \
            -p generalized-bulletproofs-ec-gadgets \
            -p full-chain-membership-proofs \
            -p monero-fcmp-plus-plus
