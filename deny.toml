[advisories]
version = 2

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

yanked = "deny"

ignore = [
  # crypto-bigint 0.5.5: timing variability in operations meant to be
  # constant-time (subtraction, zero counting, division, Montgomery
  # multiplication). Patched only in 0.7.6, and the advisory names no
  # functions, so it covers every 0.5.x. helioselene's field arithmetic is
  # built on 0.5.5, the version Shekyl's constant-time harness audits
  # (shekyl-core CRYPTO_AUDIT.md row CA-1); moving it is that audit's
  # change, not a lockfile bump. Ignored by the maintainer's ruling of
  # 2026-10-24, as in shekyl-core's rust/.cargo/audit.toml.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 is the audited pin under helioselene (CA-1); ruled 2026-10-24" },
]

[licenses]
version = 2

# Commented licenses would be allowed but are not currently present
allow = [
  # Effective public domain
  # "CC0-1.0",
  "Unlicense",

  # Attribution required
  "MIT",
  # "MITNFA",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # "Unicode-DFS-2016",
  "Unicode-3.0",
  # "OpenSSL",
  "CDLA-Permissive-2.0",

  # Non-invasive copyleft
  # "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # "GPL-3.0 WITH Classpath-exception-2.0",
]

exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = [
  # Contains a non-reproducible binary blob
  # https://github.com/serde-rs/serde/pull/2514
  # https://github.com/serde-rs/serde/issues/2575
  { name = "serde_derive", version = ">=1.0.172, <1.0.185" },
  # Introduced an insecure implementation of `borsh` removed with `0.15.1`
  # https://github.com/rust-lang/hashbrown/issues/576
  { name = "hashbrown", version = "=0.15.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
